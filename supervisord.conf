[supervisord]
nodaemon=true

[program:gunicorn]
command=gunicorn --workers=2 --bind=0.0.0.0:8000 app:app
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr